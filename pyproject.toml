[project]
name = "soulcodes-chart-service"
version = "0.1.0"
description = "Stateless astrology and Human Design chart calculation API for the Soul Codes front door"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "geonamescache>=3.0.2,<4",
    # Kerykeion 6 swaps the Swiss Ephemeris for libephemeris/Skyfield: re-validate before raising.
    "kerykeion>=5.12.10,<6",
    "pydantic>=2.14.1",
    "pyswisseph>=2.10.3.2,<2.11",
    "timezonefinder>=9.0.0,<10",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Vendored code stays as close to upstream as possible.
"src/soulcodes_chart_service/vendor/**" = ["UP042"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
# Vendored files keep upstream formatting so diffs against the source stay readable.
exclude = ["src/soulcodes_chart_service/vendor/**"]
